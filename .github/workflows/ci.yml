name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          revisions="$(git rev-list "$PR_BASE_SHA..$PR_HEAD_SHA")"
          test -n "$revisions"
          for revision in $revisions; do
            expected="$(git show -s --format='Signed-off-by: %an <%ae>' "$revision")"
            trailers="$(git show -s --format=%B "$revision" | git interpret-trailers --parse --no-divider)"
            if ! grep -Fqx -- "$expected" <<< "$trailers"; then
              echo "Missing author sign-off in $revision"
              exit 1
            fi
          done

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  haskell:
    name: Haskell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.1.0'
      - name: Build
        run: |
          cabal update
          cabal build all --enable-tests
      - name: Test
        run: cabal test all --test-show-details=direct
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned numerical dependencies
        run: python -m pip install --no-cache-dir --requirement worker/requirements.txt
      - name: Test the shared worker modules and the hf package with the built core; mlx and vllm packages run on their native hosts
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          core="$(cabal list-bin exe:invar)"
          core_directory="$(dirname "$core")"
          export PATH="$core_directory:$PATH"
          python -B -m unittest worker.tests.invocation worker.tests.probe worker.tests.probefile worker.tests.probefixture worker.tests.probepacked worker.tests.probeschema worker.tests.probestore worker.tests.resources
          python -B -m unittest discover -s worker/tests/hf -t . -p '*.py'
      - name: Format
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/fourmolu.zip" https://github.com/fourmolu/fourmolu/releases/download/v0.20.1.0/fourmolu-0.20.1.0-linux-x86_64.zip
          echo "bdd97063b445145b39191259c428bca489fa30578b82d9066fc7377db390f1d0  $RUNNER_TEMP/fourmolu.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/fourmolu.zip" -d "$RUNNER_TEMP"
          git ls-files -z '*.hs' | xargs -0 "$RUNNER_TEMP/fourmolu-0.20.1.0-linux-x86_64/fourmolu" --mode check --record-brace-space true
      - name: HLint
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/hlint.tar.gz" https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz
          echo "ccabc8802a58154699a3583b8dddc5ea2e6d65753a62c45c0e80088ebb16b42b  $RUNNER_TEMP/hlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/hlint.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/hlint-3.10/hlint" src test app
      - name: Type fixtures
        run: cabal exec -- sh test/types.sh ghc
